<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Odessa</title>
    <style>
      body { margin: 0; padding: 14px 16px; width: 300px; font: 13px/1.45 system-ui, sans-serif; background: #0b1020; color: #e2e8f0; }
      h1 { margin: 0 0 8px; font-size: 14px; }
      p { margin: 6px 0; }
      .tab { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #111a33; }
      .ok { color: #4ade80; font-weight: 600; }
      .warn { color: #fbbf24; font-weight: 600; }
      .err { color: #f87171; font-weight: 600; }
      small { color: #94a3b8; display: block; word-break: break-all; margin-top: 4px; }
      button { margin-top: 6px; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; font: 600 13px system-ui, sans-serif; cursor: pointer; transition: filter 120ms ease-out, transform 120ms ease-out; }
      button:hover { filter: brightness(1.12); }
      button:active { transform: scale(0.98); }
      button.primary { background: #0284c7; color: #fff; }
      button.secondary { background: #1e293b; color: #e2e8f0; }
    </style>
  </head>
  <body>
    <h1>Odessa — Chat do Tango</h1>
    <div id="out">Carregando…</div>
    <script src="popup.js"></script>
  </body>
</html>
