# Base44 dev environment for Odessa
# Frontend: Vite dev server on port 3000 (proxies API + tango-bridge to the backend)
# Backend: Python FastAPI / uvicorn on port 8000 (internal only)
# Tango bridge: tango_chat.py subprocess launched by the backend — drives a
#   headless Chromium (Playwright) to capture the live chat + screencast.
services:
  api-setup:
    build:
      context: .
      dockerfile: Dockerfile.base44-api
    working_dir: /app
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
      - pyenv:/app/.venv
      - playwright-cache:/root/.cache/ms-playwright
      - tango-profile:/root/.tango_profile
    command: >
      sh -c "python -m venv /app/.venv &&
             . /app/.venv/bin/activate &&
             pip install --upgrade pip &&
             pip install -r server/requirements-container.txt &&
             playwright install chromium"

  api:
    build:
      context: .
      dockerfile: Dockerfile.base44-api
    working_dir: /app
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
      - pyenv:/app/.venv
      - playwright-cache:/root/.cache/ms-playwright
      - tango-profile:/root/.tango_profile
    env_file:
      - /run/base44/app.env
    environment:
      # Headless Chromium in the container (no display server available).
      # The live screen is streamed to the UI via CDP Screencast instead.
      - TANGO_HEADLESS=true
    command: >
      sh -c ". /app/.venv/bin/activate &&
             python -m uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/server"
    depends_on:
      api-setup:
        condition: service_completed_successfully

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
      - VITE_BRIDGE_PROXY_TARGET=http://api:7555
      - DISABLE_HMR=false
    command: sh -c "npm install && npm run dev"
    depends_on:
      api:
        condition: service_started

volumes:
  pip-cache:
  pyenv:
  node-modules:
  playwright-cache:
  tango-profile:
