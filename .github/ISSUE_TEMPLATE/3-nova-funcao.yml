name: Nova função
description: Uma capacidade que o sistema ainda não tem.
title: "[Nova função] "
labels: ["nova-funcao"]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qual problema ou oportunidade motiva a função.
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo e escopo
      description: O que entra e o que fica de fora.
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      placeholder: "- [ ] ..."
