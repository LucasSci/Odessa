name: CodeQL

# Revisão de segurança automatizada (issue #247): análise estática de
# JavaScript/TypeScript e Python em todo PR para a main e semanalmente.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 5 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ javascript-typescript, python ]
    steps:
    - uses: actions/checkout@v4

    - uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended

    - uses: github/codeql-action/analyze@v3
      with:
        category: /language:${{ matrix.language }}
